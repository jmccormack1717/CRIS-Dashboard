services:
  # Backend API Service
  - type: web
    name: cris-dashboard-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QUICKBASE_API_TOKEN
        sync: false
      - key: QUICKBASE_REALM
        sync: false
      - key: QUICKBASE_TABLE_ID
        sync: false
      - key: FRONTEND_URL
        sync: false  # Set this manually after frontend deploys

  # Frontend Static Site
  - type: static
    name: cris-dashboard-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Set this to your backend URL: https://cris-dashboard-api.onrender.com

